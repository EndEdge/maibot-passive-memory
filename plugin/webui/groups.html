<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>静默群聊记忆</title>
<style>
:root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
body { margin: 0 auto; padding: 24px; max-width: 780px; }
h1 { font-size: 1.4rem; margin: 0 0 .65rem; }
p { line-height: 1.6; margin: .5rem 0 1rem; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
input[type=search], button { font: inherit; padding: .55rem .75rem; }
input[type=search] { flex: 1; min-width: 10rem; }
#list { margin-top: 1rem; }
label.group { display: flex; gap: .65rem; align-items: center; padding: .65rem .2rem; border-bottom: 1px solid GrayText; }
label.group input { width: 1rem; height: 1rem; flex: none; }
small { color: GrayText; }
</style>
<main>
<h1>静默群聊记忆</h1>
<p>选中的群会从保存后的新消息开始整理长期记忆。取消选择后停止整理该群。</p>
<div class="toolbar">
<input id="search" type="search" aria-label="搜索群名或群号" placeholder="搜索群名或群号">
<button id="refresh" type="button">刷新列表</button>
<button id="save" type="button" disabled>保存选择</button>
</div>
<p id="status" role="status">正在读取群聊…</p>
<div id="list"></div>
</main>
<script>
const search = document.querySelector('#search');
const save = document.querySelector('#save');
const refresh = document.querySelector('#refresh');
const status = document.querySelector('#status');
const list = document.querySelector('#list');
let groups = [];
let selected = new Set();
let busy = true;
let ready = false;
function draw() {
  const term = search.value.trim().toLocaleLowerCase();
  const visible = groups.filter(group => (group.name + ' ' + group.number).toLocaleLowerCase().includes(term));
  list.replaceChildren();
  for (const group of visible) {
    const label = document.createElement('label');
    label.className = 'group';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = selected.has(group.id);
    input.disabled = busy;
    input.addEventListener('change', () => {
      if (input.checked) selected.add(group.id);
      else selected.delete(group.id);
      status.textContent = '已选择 ' + selected.size + ' 个群，等待保存。';
    });
    const info = document.createElement('small');
    info.textContent = group.number + (group.status ? ' · ' + group.status : '');
    label.append(input, document.createTextNode(group.name), info);
    list.append(label);
  }
  if (ready && !visible.length) list.textContent = groups.length ? '没有匹配的群聊。' : 'MaiBot 还没有收到 QQ 群聊消息。';
  save.disabled = busy || !ready;
  refresh.disabled = busy;
}
async function load() {
  busy = true;
  draw();
  try {
    await maibot.ready;
    const result = await maibot.query('groups');
    groups = result.groups;
    selected = new Set(groups.filter(group => group.selected).map(group => group.id));
    ready = true;
    status.textContent = '已启用 ' + selected.size + ' 个群。';
  } catch (error) {
    status.textContent = '读取失败，请刷新重试。';
  } finally {
    busy = false;
    draw();
  }
}
search.addEventListener('input', draw);
refresh.addEventListener('click', load);
save.addEventListener('click', async () => {
  busy = true;
  draw();
  try {
    const result = await maibot.action('save', {selected: [...selected]});
    status.textContent = '已保存。当前启用 ' + result.count + ' 个群。';
  } catch (error) {
    status.textContent = '保存失败，请重试。';
  } finally {
    busy = false;
    draw();
  }
});
load();
</script>
